{% set name = "xrayutilities" %}
{% set version = "1.7.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d5da6262fedd92401226796ffed82c7696f0dfb9468e1bc1dab8bc4e4bd80d7e

build:
  number: 0
  script:
    - export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig                                          # [build_platform != target_platform]
    - echo "python = '${PREFIX}/bin/python'" >> ${CONDA_PREFIX}/meson_cross_file.txt        # [build_platform != target_platform]
    # meson-python already sets a buildtype; avoid duplicate --buildtype in MESON_ARGS
    - MESON_ARGS_REDUCED="$(echo $MESON_ARGS | sed 's/--buildtype[ =]release //g')"         # [unix]
    # Unix (Linux + macOS; including osx-arm64 cross builds)
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation \
        -Csetup-args=${MESON_ARGS_REDUCED// / -Csetup-args=}                                # [unix]
    # Windows (no cross-compilation)
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation                      # [win]
  skip: true  # [py2k]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - meson-python
  host:
    - python
    - pip
    - meson-python
    - numpy
    - scipy
    - h5py
  run:
    - python
    - {{ pin_compatible('numpy') }}
    - scipy
    - h5py
    - lmfit
    - matplotlib-base

test:
  imports:
    - xrayutilities             # [build_platform == target_platform]
    - xrayutilities.analysis    # [build_platform == target_platform]
    - xrayutilities.io          # [build_platform == target_platform]
    - xrayutilities.materials   # [build_platform == target_platform]
    - xrayutilities.math        # [build_platform == target_platform]
    - xrayutilities.simpack     # [build_platform == target_platform]

about:
  home: https://xrayutilities.sourceforge.io
  license: GPL-2.0-or-later
  license_family: GPL
  license_file: LICENSE.txt
  summary: package for x-ray diffraction data evaluation
  doc_url: https://xrayutilities.sourceforge.io/
  dev_url: https://github.com/dkriegner/xrayutilities

extra:
  recipe-maintainers:
    - tschoonj
    - dkriegner
